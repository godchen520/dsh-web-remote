<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#29b6f6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="560" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#4fc3f7" stroke-width="0.5">
    <line x1="0" y1="80" x2="1600" y2="80"/>
    <line x1="0" y1="160" x2="1600" y2="160"/>
    <line x1="0" y1="240" x2="1600" y2="240"/>
    <line x1="0" y1="320" x2="1600" y2="320"/>
    <line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="480" x2="1600" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="560"/>
    <line x1="400" y1="0" x2="400" y2="560"/>
    <line x1="600" y1="0" x2="600" y2="560"/>
    <line x1="800" y1="0" x2="800" y2="560"/>
    <line x1="1000" y1="0" x2="1000" y2="560"/>
    <line x1="1200" y1="0" x2="1200" y2="560"/>
    <line x1="1400" y1="0" x2="1400" y2="560"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="100" cy="80" r="200" fill="#4fc3f7" opacity="0.03"/>
  <circle cx="1500" cy="480" r="250" fill="#29b6f6" opacity="0.03"/>
  <circle cx="800" cy="280" r="300" fill="#4fc3f7" opacity="0.02"/>

  <!-- ===== LEFT: Computer monitor (pushed far left) ===== -->
  <g transform="translate(40, 80)" filter="url(#shadow)">
    <!-- Monitor body -->
    <rect x="0" y="0" width="340" height="230" rx="12" fill="#1e1e2e" stroke="#3a3a5c" stroke-width="2"/>
    <!-- Screen -->
    <rect x="12" y="12" width="316" height="186" rx="4" fill="#0d1117"/>
    <!-- Screen content: DSH UI mockup -->
    <rect x="20" y="20" width="300" height="170" rx="2" fill="#161b22"/>
    <!-- Sidebar -->
    <rect x="20" y="20" width="65" height="170" fill="#0d1117"/>
    <rect x="28" y="36" width="48" height="8" rx="2" fill="#30363d"/>
    <rect x="28" y="52" width="48" height="8" rx="2" fill="#30363d"/>
    <rect x="28" y="68" width="48" height="8" rx="2" fill="#30363d"/>
    <!-- Chat area -->
    <rect x="96" y="30" width="210" height="20" rx="4" fill="#1f6feb" opacity="0.3"/>
    <rect x="96" y="60" width="160" height="12" rx="3" fill="#30363d"/>
    <rect x="96" y="80" width="190" height="12" rx="3" fill="#30363d"/>
    <rect x="96" y="100" width="130" height="12" rx="3" fill="#30363d"/>
    <rect x="96" y="145" width="210" height="28" rx="4" fill="#21262d"/>
    <!-- Phone icon in sidebar -->
    <g transform="translate(38, 148)">
      <rect x="0" y="0" width="22" height="32" rx="3" fill="none" stroke="#4fc3f7" stroke-width="1.5"/>
      <circle cx="11" cy="27" r="2" fill="#4fc3f7"/>
    </g>
    <!-- Monitor stand -->
    <rect x="140" y="230" width="60" height="8" rx="2" fill="#3a3a5c"/>
    <rect x="120" y="238" width="100" height="4" rx="2" fill="#3a3a5c"/>
  </g>

  <!-- ===== CENTER: Long tunnel + Title ===== -->
  <!-- Long animated tunnel line stretching across the gap -->
  <g opacity="0.6">
    <line x1="420" y1="240" x2="1100" y2="240" stroke="url(#accent)" stroke-width="2" stroke-dasharray="10,5" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="0;-30" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <!-- Tunnel glow -->
    <ellipse cx="760" cy="240" rx="200" ry="10" fill="#4fc3f7" opacity="0.06"/>

    <!-- Cloud icon (center) -->
    <g transform="translate(720, 190)">
      <ellipse cx="40" cy="25" rx="38" ry="20" fill="#4fc3f7" opacity="0.15"/>
      <ellipse cx="22" cy="28" rx="24" ry="16" fill="#4fc3f7" opacity="0.15"/>
      <ellipse cx="58" cy="28" rx="24" ry="16" fill="#4fc3f7" opacity="0.15"/>
      <text x="40" y="33" text-anchor="middle" font-family="monospace" font-size="10" fill="#4fc3f7" opacity="0.8">CF</text>
    </g>

    <!-- Security shield -->
    <g transform="translate(743, 148)">
      <path d="M17,0 L34,9 L34,22 C34,31 25,37 17,42 C9,37 0,31 0,22 L0,9 Z" fill="none" stroke="#66bb6a" stroke-width="1.5" opacity="0.7"/>
      <text x="17" y="27" text-anchor="middle" font-family="monospace" font-size="11" fill="#66bb6a" opacity="0.8">🔐</text>
    </g>

    <!-- Arrow indicators -->
    <polygon points="440,235 452,228 452,242" fill="#4fc3f7" opacity="0.5"/>
    <polygon points="1080,235 1068,228 1068,242" fill="#4fc3f7" opacity="0.5"/>

    <!-- Small data packets animation -->
    <circle r="3" fill="#4fc3f7" opacity="0.6">
      <animateMotion dur="2s" repeatCount="indefinite" path="M420,240 L1100,240"/>
    </circle>
    <circle r="2" fill="#29b6f6" opacity="0.4">
      <animateMotion dur="2.5s" repeatCount="indefinite" path="M1100,240 L420,240"/>
    </circle>
  </g>

  <!-- ===== RIGHT: Phone (pushed far right) ===== -->
  <g transform="translate(1380, 60)" filter="url(#shadow)">
    <!-- Phone body -->
    <rect x="0" y="0" width="180" height="340" rx="24" fill="#1a1a2e" stroke="#3a3a5c" stroke-width="2"/>
    <!-- Phone screen -->
    <rect x="8" y="8" width="164" height="324" rx="18" fill="#0d1117"/>
    <!-- Status bar -->
    <text x="20" y="30" font-family="sans-serif" font-size="10" fill="#888">12:08</text>
    <text x="140" y="30" font-family="sans-serif" font-size="10" fill="#888">100%</text>
    <!-- DSH header on phone -->
    <rect x="16" y="42" width="148" height="32" rx="6" fill="#161b22"/>
    <text x="90" y="62" text-anchor="middle" font-family="monospace" font-size="11" fill="#e6e6e6" font-weight="bold">DeepSeek Harness</text>
    <!-- Chat messages on phone -->
    <rect x="16" y="82" width="120" height="16" rx="6" fill="#1f6feb" opacity="0.3"/>
    <rect x="44" y="106" width="108" height="12" rx="4" fill="#21262d"/>
    <rect x="44" y="124" width="90" height="12" rx="4" fill="#21262d"/>
    <rect x="16" y="148" width="128" height="16" rx="6" fill="#1f6feb" opacity="0.3"/>
    <rect x="36" y="172" width="112" height="12" rx="4" fill="#21262d"/>
    <rect x="36" y="190" width="96" height="12" rx="4" fill="#21262d"/>
    <rect x="36" y="208" width="80" height="12" rx="4" fill="#21262d"/>
    <!-- Input area -->
    <rect x="16" y="280" width="148" height="28" rx="8" fill="#21262d"/>
    <text x="30" y="298" font-family="sans-serif" font-size="10" fill="#484f58">输入消息...</text>
    <!-- Send button -->
    <circle cx="148" cy="294" r="12" fill="#1f6feb"/>
    <text x="148" y="298" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">↑</text>
    <!-- Bottom nav dots -->
    <circle cx="60" cy="320" r="3" fill="#4fc3f7"/>
    <circle cx="80" cy="320" r="3" fill="#30363d"/>
    <circle cx="100" cy="320" r="3" fill="#30363d"/>
    <circle cx="120" cy="320" r="3" fill="#30363d"/>
    <!-- Phone notch -->
    <rect x="60" y="4" width="60" height="6" rx="3" fill="#0d1117"/>
  </g>

  <!-- Connection beam from phone to center -->
  <g opacity="0.4">
    <line x1="1380" y1="240" x2="1100" y2="240" stroke="#4fc3f7" stroke-width="1.5" stroke-dasharray="4,3">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="0.8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ===== Title text (centered) ===== -->
  <text x="800" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" fill="white" font-weight="bold" letter-spacing="2">
    dsh-web-remote
  </text>

  <!-- Subtitle -->
  <text x="800" y="400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#90caf9" letter-spacing="1">
    DSH 手机 / 外网远程访问插件
  </text>

  <!-- Feature badges -->
  <g transform="translate(320, 440)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#4fc3f7" opacity="0.12" stroke="#4fc3f7" stroke-width="1" stroke-opacity="0.3"/>
    <text x="90" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4fc3f7">☁️ Cloudflare 隧道</text>

    <rect x="200" y="0" width="180" height="32" rx="16" fill="#66bb6a" opacity="0.12" stroke="#66bb6a" stroke-width="1" stroke-opacity="0.3"/>
    <text x="290" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#66bb6a">🏠 局域网直连</text>

    <rect x="400" y="0" width="180" height="32" rx="16" fill="#ffa726" opacity="0.12" stroke="#ffa726" stroke-width="1" stroke-opacity="0.3"/>
    <text x="490" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffa726">🔐 Token 安全</text>

    <rect x="600" y="0" width="180" height="32" rx="16" fill="#ab47bc" opacity="0.12" stroke="#ab47bc" stroke-width="1" stroke-opacity="0.3"/>
    <text x="690" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ab47bc">📱 扫码访问</text>
  </g>

  <!-- Version badge -->
  <g transform="translate(1480, 520)">
    <rect x="0" y="0" width="80" height="24" rx="12" fill="#30363d"/>
    <text x="40" y="16" text-anchor="middle" font-family="monospace" font-size="11" fill="#8b949e">v1.1.0</text>
  </g>

  <!-- DSH logo hint -->
  <g transform="translate(20, 520)" opacity="0.4">
    <text font-family="monospace" font-size="12" fill="#4fc3f7">deepseek HARNESS</text>
  </g>
</svg>
